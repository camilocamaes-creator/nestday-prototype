<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EEE2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nestday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Nestday prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
/* Test prototype only: accounts, data and "login" all live in this file. Not real security. */
:root{
  --bg:#F4EEE2; --surface:#FFFCF6; --ink:#1D2A23; --muted:#58625A; --line:#E2D9C6; --line2:#D6CCB6;
  --brand:#2D5B4B; --brand-dark:#1F4538; --brand-soft:#DCE8E0; --brand-ink:#1F4538;
  --sun:#E8A73A; --sun-soft:#FBEBC8; --sky:#E3EEF6; --warn:#7A2816; --warn-soft:#F8E0D6;
  --display:"Young Serif",Georgia,serif;
  --body:"Hanken Grotesk",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{height:46px;padding:0 18px;border-radius:12px;border:0;background:var(--brand);color:#fff;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.small{height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.warn{background:var(--warn-soft);color:var(--warn);border:1px solid #EBC3B2}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--brand-soft);color:var(--brand-ink)}
.pill.wait{background:var(--sun-soft);color:#6B4A0E}
.pill.bad{background:var(--warn-soft);color:var(--warn)}
.pill.grey{background:#F1ECE1;color:#3E4740}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.spacer{flex:1}
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
label.field input,label.field select{height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;font-weight:400;font-size:16px;background:#fff}
.sr{position:absolute;left:-9999px}
.num{font-variant-numeric:tabular-nums}
.banner{background:#1D2A23;color:#fff;font-size:13px;padding:8px 16px;text-align:center}
.banner .qs{display:block;margin-top:4px}
.banner .qs button{margin:0 2px;padding:2px 4px}
.banner button{background:none;border:0;color:var(--sun);font-weight:700;text-decoration:underline;padding:0 4px}

/* login */
.login{min-height:calc(100vh - 36px);display:grid;grid-template-columns:1fr 1fr}
.login .hero{background:var(--brand);color:#fff;padding:48px 56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login .hero h1{font-size:clamp(34px,4.5vw,52px)}
.login .hero p{color:#D5E4DA;font-size:18px;max-width:30em;margin:14px 0 0}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:24px}
.login .form{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.login form{width:100%;max-width:420px;display:flex;flex-direction:column;gap:16px}
.err{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:700}
.testbox{border:2px dashed var(--line2);border-radius:14px;padding:14px;background:#fff}
.testbox table{width:100%;border-collapse:collapse;font-size:14px}
.testbox td{padding:6px 4px;border-top:1px solid #F1ECE1;vertical-align:middle}
.testbox code{font-family:Consolas,"SF Mono",monospace;font-size:13px}

/* parent */
.phone{max-width:480px;margin:0 auto;min-height:calc(100vh - 36px);display:flex;flex-direction:column;background:var(--bg)}
.phead{background:var(--brand);color:#fff;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.phead a,.phead .link{color:#D5E4DA;background:none;border:0;font-size:14px;text-decoration:underline;padding:0}
.avatar{width:52px;height:52px;border-radius:50%;background:var(--sun);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:400;font-size:20px;flex-shrink:0}
.statusbar{background:rgba(255,255,255,.12);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pbody{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.tl div{display:grid;grid-template-columns:70px 84px 1fr;gap:8px;padding:11px 0;border-bottom:1px solid #F1ECE1;font-size:15px}
.tl div:last-child{border-bottom:0}
.tl .t{font-size:13px;color:var(--muted)}
.tl .k{font-weight:700}
.tabs{position:sticky;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);height:64px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{border:0;padding:0;background:none;border-radius:8px;overflow:hidden;display:block;width:100%}
.ph svg{display:block;width:100%;aspect-ratio:1}
.bubble{max-width:80%;display:flex;flex-direction:column;gap:3px}
.bubble .b{border-radius:16px 16px 16px 4px;padding:10px 14px;background:#fff;border:1px solid var(--line);font-size:15px}
.bubble.me{align-self:flex-end;align-items:flex-end}
.bubble.me .b{background:var(--brand);color:#fff;border:0;border-radius:16px 16px 4px 16px}
.bubble .w{font-size:12px;font-weight:700;color:#3E4740}
.bubble .tm{font-size:12px;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(20,30,30,.85);display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}
.lightbox .inner{background:#fff;border-radius:14px;padding:14px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
.lightbox svg{width:100%;aspect-ratio:1;border-radius:10px;display:block}
.frow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F1ECE1;font-size:15px}

/* staff + director */
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.topbar h1{font-size:22px}
.wrap{padding:20px 24px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.kid{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;text-align:left;min-height:68px}
.kid.sel{border-color:var(--brand)}
.kid.out{background:#F1ECE1}
.kid .ini{width:42px;height:42px;border-radius:50%;background:#EAE3D3;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.kid.sel .ini{background:var(--brand);color:#fff}
.kid .flag{font-size:12px;font-weight:700;color:#9A3A1E;margin-left:auto;text-align:right}
.logbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.logbtns button{height:54px;border-radius:12px;border:1px solid var(--line2);background:#F1ECE1;font-weight:700}
.feed{max-height:300px;overflow:auto;font-size:14px}
.feed div{padding:8px 0;border-bottom:1px solid #F1ECE1}
.tile{align-items:flex-start;min-height:84px}
.tile .tb{display:flex;flex-direction:column;gap:4px;min-width:0}
.tile.sel .ini{font-size:20px}
.flagt{font-size:11px;font-weight:700;color:#7A2816;background:var(--warn-soft);border-radius:10px;padding:1px 6px;margin-left:2px}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.bd{font-size:12px;background:#F1ECE1;color:#3E4740;border-radius:10px;padding:2px 8px;white-space:nowrap}
.bd.miss{background:var(--sun-soft);color:#6B4A0E}
.bd.napb{background:#E3EEF6;color:#2C4F8A;font-weight:700}
.bd.off{background:transparent;color:var(--muted);padding-left:0}
.due{display:flex;gap:12px;align-items:center;justify-content:space-between;border-radius:14px;padding:12px 16px;border:1px solid}
.due.meds{background:var(--sun-soft);border-color:#EFD39A}
.due.nap{background:#E3EEF6;border-color:#BCD3EA}
.due.late{background:var(--warn-soft);border-color:#EBC3B2;color:var(--warn)}
.due .btn{flex-shrink:0}
.actionbar{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.06);padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actionbar .abl{font-weight:700;margin-right:auto}
.ab{height:52px;min-width:92px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:#F1ECE1;font-weight:700}
.ab.warnb{background:var(--warn-soft);color:var(--warn);border-color:#EBC3B2}
.sheetbg{position:fixed;inset:0;background:rgba(20,30,30,.45);z-index:20}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:20px;z-index:21;display:flex;flex-direction:column;gap:14px}
.srow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srow .sl{width:100%;font-size:13px;font-weight:700;color:var(--muted)}
.undobar{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1D2A23;color:#fff;border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;z-index:30;font-size:15px}
.undobar button{background:var(--sun);color:#1D2A23;border:0;border-radius:8px;padding:8px 14px;font-weight:700}
.etabs{display:flex;gap:4px;padding:10px 24px 0;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
.etabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.etabs button[aria-current="page"]{color:var(--brand);border-bottom-color:var(--brand)}
.segs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#EAE3D3;padding:5px;border-radius:12px}
.seg{border:0;background:none;height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:0 14px;height:38px;font-weight:700;font-size:14px;display:inline-flex;align-items:center}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.off{background:#F1ECE1;color:#6E766F;border-style:dashed}
.noterow{display:grid;grid-template-columns:minmax(150px,220px) 1fr;gap:12px;align-items:start;padding:10px 0;border-top:1px solid #F1ECE1}
.noterow .who{display:flex;gap:10px;align-items:center}
.noterow .ini{width:38px;height:38px;border-radius:50%;background:#EAE3D3;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
textarea{width:100%;border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-weight:400;font-size:16px;background:#fff;resize:vertical}
.qrwrap{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:center}
.qr{width:220px;height:220px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center}
.qr svg{width:100%;height:100%;display:block}
.qr.placeholder{color:#B8C2BC;font-family:var(--display);font-weight:400;font-size:40px;border-style:dashed}
.steps{margin:0;padding-left:20px}
.pickbig{border:2px dashed #B7AC93;border-radius:14px;background:#fff;padding:24px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;color:var(--brand);cursor:pointer}
.pickbig .small{color:var(--muted)}
.thumb{position:relative}
.thumb img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(20,30,30,.75);color:#fff;font-size:18px;line-height:1}
.thumb .bar{position:absolute;left:6px;right:6px;bottom:6px;height:6px;background:rgba(255,255,255,.7);border-radius:4px;overflow:hidden}
.thumb .bar span{display:block;height:100%;background:var(--brand)}
.donecheck{width:64px;height:64px;border-radius:50%;background:var(--brand-soft);color:var(--brand-ink);font-size:34px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:12px;color:var(--muted)}
.sumrow span{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.sumrow b{display:block;font-family:var(--display);font-size:20px;color:var(--ink)}
.flabel{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-ink)}
.fcap{font-size:16px;line-height:1.45}
.feeditem.note{background:#FFFCF6;border-color:#EFD39A}
.fnote{font-size:17px;line-height:1.5}
.lightbox img{width:100%;border-radius:10px;display:block;max-height:70vh;object-fit:contain;background:#111}
.dir{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 36px)}
.side{background:var(--brand-dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.side button{background:none;border:0;color:#D5E4DA;text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.side button[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.main{padding:26px 30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi .v{font-family:var(--display);font-weight:400;font-size:32px}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-size:12px;letter-spacing:.06em;color:var(--muted);padding:10px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 8px;border-bottom:1px solid #F1ECE1;vertical-align:middle}
.tblbox{overflow-x:auto}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#1D2A23;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}

.dantia{display:inline-flex;flex-direction:column;gap:6px;--dtMark:#1F4622;--dtInk:#1C1913;--dtL:#58625A}
.dantia .dtL{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dtL);line-height:1}
.dantia .dtLogo{display:inline-flex;align-items:center;gap:8px;color:var(--dtInk)}
.dantia .dtMark{width:20px;height:20px;color:var(--dtMark);flex:none;display:block}
.dantia .dtName{font-family:"Dantia Marca","Playfair Display","Iowan Old Style",Georgia,serif;font-weight:700;font-size:19px;line-height:1;letter-spacing:-.01em}
.dantia.onbrand{--dtMark:#FFFFFF;--dtInk:#FFFFFF;--dtL:#C9DED6}
.dantia.big .dtMark{width:26px;height:26px}.dantia.big .dtName{font-size:24px}
.pfoot{display:flex;justify-content:center;padding:18px 0 6px}

@media (max-width:860px){
  .login{grid-template-columns:1fr}
  .login .hero{padding:28px 20px}

  function batches(id) {
    const out = [], byKey = {};
    kidUploads(id).forEach(x => {
      const key = x.u.batch || (x.u.t + '|' + (x.u.cap || '') + '|' + x.u.by);
      if (!byKey[key]) { byKey[key] = { t: x.u.t, cap: x.u.cap || '', by: x.u.by, items: [] }; out.push(byKey[key]); }
      byKey[key].items.push(x);

  function parentToday(c) {

    const bs = batches(c.id);
    const nPhotos = bs.reduce((n, b) => n + b.items.length, 0) + first.length;
    const count = k => items.filter(l => l.k === k).length;
    // Newest first: notes and photos as cards, care entries (meals, naps...) as compact rows.
    const feed = [];
    items.forEach((l, i) => { if (l.k !== 'Photos') feed.push({ m: mins(l.t), o: i, type: l.k === 'Note' ? 'note' : 'care', l }); });
    bs.forEach((b, i) => feed.push({ m: mins(b.t), o: 1000 + i, type: 'photos', b }));

    let main;
    if (ui.noteMode === 'each') {
      main = '<section class="card stack"><div class="row"><b>Write a note for each child</b><span class="spacer"></span><span class="small muted">Empty boxes are skipped</span></div>' +
        kids.map(k => { const n = lastNote(k.id); return '<div class="noterow"><div class="who"><span class="ini">' + esc(k.ini) + '</span><div><b>' + esc(k.first) + '</b><div class="small ' + (n ? 'muted' : '') + '" style="' + (n ? '' : 'color:#7A2816;font-weight:700') + '">' + (n ? 'Sent ' + esc(n.t) + ': ' + esc(n.v.length > 40 ? n.v.slice(0, 40) + '…' : n.v) : 'No note yet today') + '</div></div></div>' +
          '<label class="sr" for="note-' + k.id + '">Note for ' + esc(k.first) + '</label><textarea id="note-' + k.id + '" data-keep rows="2" placeholder="What did ' + esc(k.first) + ' do today?"></textarea></div>'; }).join('') +
        '<div class="row"><span class="spacer"></span><button class="btn" data-a="sendeach">Send notes to families</button></div></section>';
    } else {
      const chips = kids.map(k => '<button class="chip' + (ui.noteSel.includes(k.id) ? ' on' : '') + '" data-a="nsel" data-id="' + k.id + '" aria-pressed="' + ui.noteSel.includes(k.id) + '">' + esc(k.first) + '</button>').join('');
      const phrases = ['Had a great day', 'Played outside in the morning', 'We did a craft for Thanksgiving', 'Needs more diapers, please', 'Was a bit tired today'];
      main = '<section class="card stack"><b>One note for several children</b>' +
        '<div class="row" style="flex-wrap:wrap;gap:8px"><span class="small muted">Send to:</span>' + chips + '<button class="btn small ghost" data-a="nall">All here</button><button class="btn small ghost" data-a="nnone">None</button></div>' +
        '<label class="field">Note (' + ui.noteSel.length + (ui.noteSel.length === 1 ? ' child' : ' children') + ')<textarea id="gnote" data-keep rows="4" placeholder="e.g. Today we planted seeds in the garden and talked about how plants grow."></textarea></label>' +
        '<div class="row" style="flex-wrap:wrap;gap:8px"><span class="small muted">Quick add:</span>' + phrases.map(p => '<button class="chip" data-a="phrase" data-p="' + esc(p) + '">+ ' + esc(p) + '</button>').join('') + '</div>' +
        '<div class="row"><span class="small muted">Each family sees it as a note on their own child\'s day.</span><span class="spacer"></span><button class="btn" data-a="sendgroup">Send to ' + ui.noteSel.length + (ui.noteSel.length === 1 ? ' family' : ' families') + '</button></div></section>';
    }
    const recent = D.log.filter(l => l.k === 'Note').slice().reverse().slice(0, 8);
    return '<div class="wrap"><div class="stack"><div class="segs">' + modeBtn('each', 'A note for each child') + modeBtn('group', 'One note for several children') + '</div>' + main + '</div>' +
      '<aside class="stack"><section class="card stack"><b>Still need a note today</b>' +
      (kids.filter(k => !notedToday(k.id)).map(k => '<div class="row"><span>' + esc(k.name) + '</span></div>').join('') || '<div class="small" style="color:var(--brand-ink);font-weight:700">Every child here has a note. Nice work.</div>') + '</section>' +
      '<section class="card"><b>Notes sent today</b><div class="feed">' + (recent.map(l => '<div><b>' + esc(l.t) + '</b> · ' + esc(kid(l.kid).first) + ': ' + esc(l.v) + '</div>').join('') || '<div class="muted">None yet.</div>') + '</div></section>' +
      '<div style="padding:8px 4px">' + dantia() + '</div></aside></div>';
  }

  // The QR opens this same page with a short-lived upload link: #up-<expiry minute>-<child ids>.
  function uploadHash(kids, exp) { return '#up-' + exp + '-' + kids.join('.'); }
  function uploadUrl(kids, exp) { return (SH ? ARTIFACT_URL : location.href.split('#')[0]) + uploadHash(kids, exp); }

  function eduPhotos() {
    const kids = hereKids();
    const chips = kids.map(k => noPhotos(k)
      ? '<span class="chip off" title="Family said no to photos">' + esc(k.first) + ' · no photos</span>'
      : '<button class="chip' + (ui.photoKids.includes(k.id) ? ' on' : '') + '" data-a="pkid" data-id="' + k.id + '" aria-pressed="' + ui.photoKids.includes(k.id) + '">' + esc(k.first) + '</button>').join('');
    const nowMin = Math.floor(Date.now() / 60000);
    const live = ui.photoKids.length && ui.qrExp > nowMin;
    const names = ui.photoKids.map(id => kid(id).first).join(', ');
    const host = location.hostname;
    const hostNote = SH ? '<div class="small muted">Your phone needs to be signed in to claude.ai. Photos appear here and for the family as soon as they are sent.</div>'
      : '<div class="small" style="color:#6B4A0E">Test copy with no server: photos stay in the browser that sends them. To try the whole flow, use one device. On a phone, tap Choose photos on this device instead. On a computer, open the upload page in a new tab. Scanning with a second device needs the real server.</div>';
    const qrBox = live
      ? '<div class="qrwrap"><div id="qr" class="qr" aria-label="QR code to upload photos of ' + esc(names) + '"></div><div class="stack" style="gap:8px"><b style="font-size:20px">Scan to upload photos of ' + esc(names) + '</b>' +
        '<ol class="steps small"><li>Open your phone camera and point it at the code.</li><li>Tap the link, then choose the photos.</li><li>Tap Send. They go only to ' + esc(names) + (ui.photoKids.length === 1 ? '\'s family.' : '\'s families.') + '</li></ol>' +
        '<div class="small muted">This code only works for the Sunflower Room and stops working at ' + fmtT(new Date(ui.qrExp * 60000)) + '.</div>' + hostNote +
        '<div class="row" style="flex-wrap:wrap"><button class="btn small ghost" data-a="openup">Choose photos on this device instead</button>' + (SH ? '' : '<a class="btn small ghost" target="_blank" rel="noopener" href="' + esc(uploadUrl(ui.photoKids, ui.qrExp)) + '">Open upload page in a new tab</a>') + '<button class="btn small ghost" data-a="qrnew">New code</button></div></div></div>'
      : '<div class="qrwrap empty"><div class="qr placeholder">QR</div><div class="stack" style="gap:6px"><b>Pick who is in the photos first</b><span class="small muted">Then a code appears here. One code per child, or per group for group photos.</span></div></div>';
    const recent = (D.uploads || []).slice().reverse().slice(0, 18);
    return '<div class="wrap"><div class="stack"><section class="card stack"><b>1. Who is in the photos?</b><div class="row" style="flex-wrap:wrap;gap:8px">' + chips + '</div>' +
      '<div class="small muted">Children whose families said no to photos cannot be picked.</div></section>' +
      '<section class="card stack"><b>2. Scan and upload</b>' + qrBox + '</section></div>' +
      '<aside class="stack"><section class="card stack"><b>Uploaded today</b>' +
      (recent.length ? '<div class="grid3">' + recent.map(u => '<img src="' + uploadSrc(u) + '" alt="Photo of ' + esc(u.kids.map(id => kid(id).first).join(', ')) + '" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">').join('') + '</div><div class="small muted">' + D.uploads.length + ' photos from this room</div>' : '<div class="small muted">Nothing yet. Photos you upload from your phone show up here.</div>') +
      '</section><div style="padding:8px 4px">' + dantia() + '</div></aside></div>';
  }

  function viewUpload(p) {
    const kids = p.kids.map(kid).filter(Boolean);
    const names = kids.map(k => k.first).join(', ');
    const nowMin = Math.floor(Date.now() / 60000);
    let body;
    if (!kids.length) body = '<div class="card">This upload link is not valid. Ask the educator to show the code again.</div>';
    else if (p.exp < nowMin) body = '<div class="card stack"><b>This code has expired</b><div>Codes stop working after 15 minutes so an old photo of the screen can\'t be used. Ask the educator for a new code.</div></div>';
    else if (kids.some(noPhotos)) body = '<div class="card">One of these children\'s families said no to photos, so this link cannot be used.</div>';
    else if (ui.up.stage === 'done') body = '<div class="card stack" style="text-align:center;align-items:center"><div class="donecheck" aria-hidden="true">✓</div><b style="font-size:20px">' + ui.up.sent + (ui.up.sent === 1 ? ' photo sent' : ' photos sent') + '</b><div>They are now on ' + esc(names) + (kids.length === 1 ? '\'s' : '\'s families\'') + ' day.</div>' +
      '<div class="row"><button class="btn" data-a="upmore">Upload more of ' + esc(names) + '</button></div>' + (user && user.role === 'educator' ? '<button class="btn ghost" data-a="upback">Back to the room</button>' : '') + kids.map(k => { const i = ACCOUNTS.findIndex(x => x.child === k.id); return i < 0 ? '' : '<button class="btn ghost" data-a="as" data-i="' + i + '">See it as ' + esc(k.first) + '\'s parent</button>'; }).join('') + '</div>';
    else {
      const files = ui.up.files;
      body = '<section class="card stack"><div class="small muted">Photos of</div><div class="row" style="flex-wrap:wrap;gap:8px">' + kids.map(k => '<span class="chip on">' + esc(k.first) + '</span>').join('') + '</div></section>' +
        '<label class="pickbig"><input id="upfiles" type="file" accept="image/*" multiple class="sr">' +
        '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>' +
        '<b>' + (files.length ? 'Add more photos' : 'Choose photos') + '</b><span class="small">From your camera roll. Pick as many as you like.</span></label>' +
        (ui.up.busy ? '<div class="small muted" role="status">Preparing photos…</div>' : '') +
        (files.length ? '<div class="grid3">' + files.map((f, i) => '<div class="thumb"><img src="' + f.src + '" alt="Selected photo ' + (i + 1) + '"><button class="x" data-a="uprm" data-i="' + i + '" aria-label="Remove photo ' + (i + 1) + '">×</button>' + (ui.up.stage === 'sending' ? '<span class="bar"><span style="width:' + (f.pct || 0) + '%"></span></span>' : '') + '</div>').join('') + '</div>' +
          '<label class="field">Caption (optional)<input id="upcap" data-keep placeholder="e.g. Painting leaves in the art corner"></label>' +
          '<button class="btn" style="height:54px;font-size:17px"' + (ui.up.stage === 'sending' ? ' disabled' : '') + ' data-a="upsend">' + (ui.up.stage === 'sending' ? 'Sending…' : 'Send ' + files.length + (files.length === 1 ? ' photo' : ' photos')) + '</button>' : '') +
        '<div class="small muted">Test prototype: the photos stay in this phone\'s browser. In the real product they go to the centre\'s private storage, the same way the wedding photo site works.</div>';
    }
    return '<div class="phone"><div class="phead"><div class="row"><span class="logo" style="font-size:18px">Nestday</span><span class="spacer"></span><span class="small" style="color:#D5E4DA">Sunflower Room</span></div><h1 style="font-size:26px">Upload photos</h1></div><main class="pbody">' + body + '<div class="pfoot">' + dantia() + '</div></main></div>';
  }

  // ---------- educator room: roster first, tap children, then one action ----------
  // Pattern from Famly and Brightwheel: the room's children are the home screen, each tile shows
  // the last meal, change and nap, and an action bar at the bottom logs for everyone selected.
  const MENU = { 'Breakfast': 'oatmeal, pears', 'AM snack': 'crackers, cheese', 'Lunch': 'pasta, peas, milk', 'PM snack': 'apple slices, yogurt' };
  const MEALS = Object.keys(MENU).concat(['Meal']);
  const CHECK_MIN = 15; // sleep check interval; a centre setting in the real product
  function lastOf(id, kinds) { for (let i = D.log.length - 1; i >= 0; i--) { const l = D.log[i]; if (l.kid === id && kinds.includes(l.k)) return l; } return null; }
  function minsAgo(ts) { const m = Math.max(0, Math.round((Date.now() - ts) / 60000)); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + (m % 60) + ' min'; }

  function napBanner() {
    const ids = Object.keys(D.naps || {}).filter(id => kid(id) && kid(id).here);
    if (!ids.length) return '';
    const last = Math.min.apply(null, ids.map(id => D.naps[id].check));
    const due = last + CHECK_MIN * 60000;
    const late = Date.now() > due;
    return '<div class="due ' + (late ? 'late' : 'nap') + '" role="status"><div><b>' + ids.length + (ids.length === 1 ? ' child napping' : ' children napping') + '</b> · ' + ids.map(id => esc(kid(id).first)).join(', ') +
      '<div class="small">' + (late ? 'Sleep check overdue since ' + fmtT(new Date(due)) : 'Last check ' + minsAgo(last) + ' ago · next check by ' + fmtT(new Date(due))) + '</div></div><button class="btn small" data-a="napcheck">Check all asleep</button></div>';
  }

  function medsBanner() {
    if (D.medsDone) return '';
    return '<div class="due meds"><div><b>Medication due 11:00 am</b> · Leo S., Salbutamol 2 puffs<div class="small">Parent consent on file until 30 Nov.</div></div><button class="btn small" data-a="meds">Record dose</button></div>';
  }

  function tile(k) {
    const on = ui.sel.includes(k.id);
    const meal = lastOf(k.id, MEALS), ch = lastOf(k.id, ['Diaper', 'Toilet']), nap = D.naps && D.naps[k.id];
    let badges = '';
    if (!k.here) badges = '<span class="bd off">' + esc(k.note || 'Not checked in') + '</span>';
    else {
      if (nap) badges += '<span class="bd napb">Napping ' + minsAgo(nap.start) + '</span>';
      badges += meal ? '<span class="bd">Ate ' + esc(meal.t) + '</span>' : '<span class="bd miss">No meal yet</span>';
      if (ch) badges += '<span class="bd">Change ' + esc(ch.t) + '</span>';
    }
    return '<button class="kid tile' + (on ? ' sel' : '') + (k.here ? '' : ' out') + '" data-a="pick" data-id="' + k.id + '" aria-pressed="' + on + '">' +
      '<span class="ini">' + (on ? '✓' : esc(k.ini)) + '</span><span class="tb"><b>' + esc(k.name) + '</b>' + (k.flag ? ' <span class="flagt">' + esc(k.flag) + '</span>' : '') + '<span class="badges">' + badges + '</span></span></button>';
  }

  function eduRoom() {
    const n = ui.sel.length;
    const feed = D.log.slice().reverse().slice(0, 10).map(l => '<div><b>' + esc(l.t) + '</b> · ' + esc((kid(l.kid) || {}).first || '') + ' · ' + esc(l.k) + ': ' + esc(l.v) + '</div>').join('');
    const acts = [['meal', 'Meal'], ['nap', 'Nap'], ['diaper', 'Diaper'], ['note', 'Note'], ['photo', 'Photos'], ['incident', 'Incident']];
    return '<div class="wrap"><div class="stack">' + medsBanner() + napBanner() +
      '<div class="row"><b>' + (n ? n + ' selected' : 'Tap children to select them') + '</b><span class="spacer"></span><button class="btn small ghost" data-a="selall">All here</button><button class="btn small ghost" data-a="selnone">Clear</button></div>' +
      '<div class="kids">' + D.kids.map(tile).join('') + '</div></div>' +
      '<aside class="stack">' + ((D.uploads || []).length ? '<section class="card stack"><div class="row"><b>Photos today · ' + D.uploads.length + '</b><span class="spacer"></span><button class="btn small ghost" data-a="gophotos">See all</button></div><div class="grid3">' + D.uploads.slice(-6).reverse().map(u => '<img src="' + uploadSrc(u) + '" alt="Photo from the room" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px">').join('') + '</div></section>' : '') +
      '<section class="card"><b>Room log</b><div class="feed" aria-live="polite">' + (feed || '<div class="muted">Nothing yet.</div>') + '</div></section>' +
      '<div style="padding:8px 4px">' + dantia() + '</div></aside></div>' +
      '<div class="actionbar" role="toolbar" aria-label="Log for selected children"><span class="abl">' + (n ? 'For ' + n + (n === 1 ? ' child' : ' children') : 'Pick an action, or tap children first') + '</span>' +
      '<button class="ab" data-a="checkin">' + ico('checkin', 20) + 'Check in/out</button>' +
      acts.map(([t, l]) => '<button class="ab' + (t === 'incident' ? ' warnb' : '') + '" data-a="sheet" data-t="' + t + '">' + ico(t === 'meal' ? 'meal' : t === 'nap' ? 'nap' : t === 'diaper' ? 'diaper' : t === 'note' ? 'note' : t === 'photo' ? 'photo' : 'incident', 20) + l + '</button>').join('') + '</div>' +
      (ui.sheet ? sheetView() : '') + undoBar();
  }

  function undoBar() {
    if (!ui.undo || Date.now() > ui.undo.until) return '';
    return '<div class="undobar" role="status">' + esc(ui.undo.label) + '<button data-a="undo">Undo</button></div>';
  }

  function sheetView() {
    const t = ui.sheet.type;
    const titles = { meal: 'Meal', nap: 'Nap', diaper: 'Diaper or potty', note: 'Note to families', incident: 'Incident report' };
    const chip = (a, v, cur, label) => '<button class="chip' + (cur === v ? ' on' : '') + '" data-a="' + a + '" data-v="' + esc(v) + '" aria-pressed="' + (cur === v) + '">' + esc(label || v) + '</button>';
    const kids = hereKids().map(k => '<button class="chip' + (ui.sel.includes(k.id) ? ' on' : '') + '" data-a="pick" data-id="' + k.id + '" aria-pressed="' + ui.sel.includes(k.id) + '">' + esc(k.first) + '</button>').join('');
    const times = [0, 10, 20, 30].map(m => chip('sago', String(m), String(ui.sheet.ago), m ? m + ' min ago' : 'Now')).join('');
    let body = '';
    if (t === 'meal') body = '<div class="srow"><span class="sl">Which meal</span>' + Object.keys(MENU).map(m => chip('smeal', m, ui.sheet.meal)).join('') + '</div>' +
      '<div class="small muted">From this week\'s menu: ' + esc(MENU[ui.sheet.meal]) + '</div>' +
      '<div class="srow"><span class="sl">How much</span>' + ['All', 'Most', 'Some', 'None'].map(v => chip('samt', v, ui.sheet.amt)).join('') + '</div>';
    if (t === 'diaper') body = '<div class="srow"><span class="sl">Type</span>' + ['Wet', 'BM', 'Dry', 'Potty success'].map(v => chip('skind', v, ui.sheet.kind)).join('') + '</div>';
    if (t === 'nap') body = '<div class="srow"><span class="sl">What happened</span>' + chip('snap', 'start', ui.sheet.nap, 'Fell asleep') + chip('snap', 'end', ui.sheet.nap, 'Woke up') + '</div><div class="small muted">While children nap, a banner reminds you to check them every ' + CHECK_MIN + ' minutes.</div>';
    if (t === 'note') body = '<label class="field">Note<textarea id="sheetnote" data-keep rows="3" placeholder="e.g. We planted seeds in the garden today."></textarea></label>' +
      '<div class="row" style="flex-wrap:wrap;gap:6px">' + ['Had a great day', 'Played outside in the morning', 'Needs more diapers, please', 'Was a bit tired today'].map(p => '<button class="chip" data-a="phrase" data-target="sheetnote" data-p="' + esc(p) + '">+ ' + esc(p) + '</button>').join('') + '</div>' +
      '<div class="small muted">For a different note for each child, use the Notes tab.</div>';
    if (t === 'incident') body = '<label class="field">What happened<textarea id="sheetinc" data-keep rows="3" placeholder="e.g. Bumped knee on the slide at 10:40. Ice pack given, no swelling."></textarea></label><div class="small muted">The family is told right away and the director gets it to sign.</div>';
    const n = ui.sel.filter(id => kid(id).here).length;
    return '<div class="sheetbg" data-a="sheetclose"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="' + titles[t] + '">' +
      '<div class="row"><h2 style="font-size:22px">' + titles[t] + '</h2><span class="spacer"></span><button class="btn small ghost" data-a="sheetclose">Cancel</button></div>' +
      '<div class="srow"><span class="sl">Children</span>' + kids + '</div>' +
      '<div class="srow"><span class="sl">When</span>' + times + '</div>' + body +
      '<button class="btn" style="height:52px;font-size:17px" data-a="sheetsave"' + (n ? '' : ' disabled') + '>' + (n ? 'Save for ' + n + (n === 1 ? ' child' : ' children') : 'Pick at least one child') + '</button></div>';
  }

  function viewDirector() {
    const sun = D.kids.filter(k => k.here).length;
    const present = 51 + sun;
    const openInc = D.incidents.filter(i => !i.signed);
    const pending = D.guardians.filter(g => g.status === 'Invite sent').length;
    const expiring = D.staff.filter(s => s.status === 'Active' && daysUntil(s.firstAid) <= 30);
    const attention = openInc.length + 1 + (pending ? 1 : 0) + (expiring.length ? 1 : 0);
    const nav = [['today', 'Today'], ['families', 'Families and logins'], ['staff', 'Staff accounts']];
    const body = ui.dtab === 'today' ? dirToday(present, sun, openInc, pending, attention, expiring) : ui.dtab === 'staff' ? dirStaff() : dirFamilies();
    return '<div class="dir"><nav class="side" aria-label="Director menu"><div class="logo" style="font-size:20px;padding:0 12px 4px">Nestday</div>' +
      '<div class="small" style="color:#B9CFC3;padding:0 12px 14px">Sunflower Early Learning · Airdrie</div>' +
      nav.map(([id, l]) => '<button data-a="dtab" data-t="' + id + '"' + (ui.dtab === id ? ' aria-current="page"' : '') + '>' + l + '</button>').join('') +
      '<button data-a="nope">Fees and billing</button><button data-a="nope">Reports and grant claim</button>' +
      '<span class="spacer"></span><div style="padding:14px 12px">' + dantia('onbrand') + '</div><button data-a="logout">Sign out</button></nav><main class="main">' + body + '</main></div>';
  }

  function dirToday(present, sun, openInc, pending, attention, expiring) {
    const rooms = [['Seedlings', 'Under 12 months', 5, 2, 3], ['Sprouts', '12 to 19 months', 8, 2, 4], ['Sunflower', '19 months to 3 yrs', sun, D.educators, 6], ['Maple', '3 to 4½ yrs', 22, 3, 8], ['Oak', '3 to 4½ yrs', 16, 2, 8]];
    const inRatio = rooms.filter(r => r[3] >= Math.ceil(r[2] / r[4])).length;
    return '<div class="row" style="flex-wrap:wrap"><div><div class="small muted">Thursday, 24 September</div><h1 style="font-size:32px">Good morning, ' + esc(user.name.split(' ')[0]) + '</h1></div><span class="spacer"></span><button class="btn" data-a="announce">Send announcement</button></div>' +
      '<div class="kpis"><div class="card kpi"><div class="small muted">Children here</div><div class="v num">' + present + ' <span class="small muted">of 64</span></div></div>' +
      '<div class="card kpi"><div class="small muted">Educators on shift</div><div class="v num">' + (9 + D.educators) + '</div></div>' +
      '<div class="card kpi" style="' + (inRatio === 5 ? 'background:var(--brand-soft)' : 'background:var(--warn-soft)') + '"><div class="small">Rooms in ratio</div><div class="v num">' + inRatio + ' <span class="small">of 5</span></div></div>' +
      '<div class="card kpi" style="background:var(--warn-soft)"><div class="small" style="color:var(--warn)">Needs your attention</div><div class="v num" style="color:var(--warn)">' + attention + '</div></div></div>' +
      '<div class="two"><section class="card tblbox"><table class="tbl"><thead><tr><th>ROOM</th><th>AGE GROUP</th><th>CHILDREN</th><th>EDUCATORS</th><th>RATIO</th></tr></thead><tbody>' +

  // Shrinks a chosen photo for the demo. The real product would upload the full photo (compressed like the wedding site).
  function shrink(file, max, asBlob) {
    return new Promise(resolve => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const sc = Math.min(1, (max || 480) / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        if (asBlob) c.toBlob(b => resolve(b), 'image/jpeg', 0.82);
        else resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
      img.src = url;
    });
  }

          f.pct = 100; render();
        }
        if (ok) p.kids.forEach(id => D.log.push({ kid: id, t: now(), k: 'Photos', v: ok + (ok === 1 ? ' new photo' : ' new photos') + (cap.trim() ? ' · ' + cap.trim() : '') }));
        if (SH) save(); else if (!saveUploads()) toast('This browser is out of space for demo photos');
        ui.up = { files: [], stage: 'done', sent: ok, busy: false }; ui.keep.upcap = ''; render();
        if (ok < files.length) toast((files.length - ok) + ' photos could not be sent. Try again.');
      })();
    }
    if (a === 'sact') {
      const s = D.staff[+b.dataset.i], op = b.dataset.op;
      if (op === 'pin') { s.pin = false; toast(s.name + ' will set a new PIN at the next tablet sign-in'); }
      if (op === 'off') { s.status = 'Access off'; s.last = 'Turned off today ' + now(); toast('Access turned off for ' + s.name + '. They are signed out everywhere.'); }
      if (op === 'on') { s.status = 'Invite sent'; s.last = 'Sent today ' + now(); toast('New invite sent to ' + s.email); }
      if (op === 'resend') { s.last = 'Sent today ' + now(); toast('Invite sent again to ' + s.email); }
      save(); render();
    }
    if (a === 'gact') {
      const g = D.guardians[+b.dataset.i];
      if (g.status === 'Locked') { g.status = 'Invite sent'; g.last = 'Reset ' + now(); toast('Access reset. ' + g.name + ' gets a new link.'); }
      else { g.status = 'Invite sent'; g.last = 'Sent today ' + now(); toast('Invite sent to ' + g.email); }
      save(); render();
    }
  });

  document.addEventListener('submit', e => {
    e.preventDefault();
    if (e.target.id === 'loginForm') {
      const email = document.getElementById('email').value.trim().toLowerCase();
      const pw = document.getElementById('pw').value;
      const acc = ACCOUNTS.find(x => x.email === email && x.password === pw);
      ui.email = email; ui.pw = '';
      if (!acc) { ui.err = 'That email and password don\'t match a test account. Use one from the list below.'; render(); return; }
      const st = D.staff.find(s => s.email === acc.email);
      if (st && st.status !== 'Active') { ui.err = 'The director has turned off access for this account. Ask them to turn it back on.'; render(); return; }
      user = { email: acc.email, role: acc.role, name: acc.name, child: acc.child }; saveUser(user); ui.err = ''; render();
    }
    if (e.target.id === 'msgForm') {
      const inp = document.getElementById('msg'); const v = inp.value.trim(); if (!v) return;
      const c = user.child;
      D.messages[c].push({ me: true, t: 'Today ' + now(), v }); save(); render();
      setTimeout(() => { D.messages[c].push({ w: 'Priya K.', t: 'Today ' + now(), v: 'Thanks, got it! (automatic demo reply)' }); save(); if (user && ui.tab === 'messages') render(); }, 1500);
    }
    if (e.target.id === 'sForm') {
      const name = document.getElementById('sname').value.trim();
      const email = document.getElementById('semail').value.trim();
      const aid = document.getElementById('said').value || '2027-09-24';
      if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Add a name and a valid email'); return; }
      D.staff.push({ name, email, role: document.getElementById('srole').value, room: document.getElementById('sroom').value, level: document.getElementById('slevel').value, firstAid: aid, status: 'Invite sent', last: 'Sent today ' + now(), pin: false });
      save(); toast('Invite sent to ' + email + ' (not really)'); render();
    }
    if (e.target.id === 'gForm') {
      const name = document.getElementById('gname').value.trim();
      const email = document.getElementById('gemail').value.trim();
      if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('Add a name and a valid email'); return; }
      D.guardians.unshift({ child: document.getElementById('gchild').value, room: 'Sunflower', name, email, status: 'Invite sent', last: 'Sent today ' + now() });
      save(); toast('Invite sent to ' + email + ' (not really)'); render();
    }
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.light) { ui.light = null; render(); } });

  document.addEventListener('change', async e => {
    if (e.target.id !== 'upfiles') return;
    const picked = Array.from(e.target.files || []).filter(f => /^image\//.test(f.type));
    if (!picked.length) return;
    ui.up.busy = true; render();
    for (const f of picked.slice(0, 30)) { const src = await shrink(f); if (src) ui.up.files.push({ src, pct: 0, file: f }); }
    if (picked.length > 30) toast('The test takes up to 30 photos at a time');
    ui.up.busy = false; render();
  });

  window.addEventListener('storage', e => {
    if (SH || e.key !== KEY) return;
    const fresh = load(); if (!fresh) return;
    const before = (D.uploads || []).length;
    D = fresh; if (!D.staff) D.staff = freshStaff(); if (!D.uploads) D.uploads = [];
    const added = D.uploads.length - before;
    if (added > 0 && user && user.role === 'educator') toast(added + (added === 1 ? ' new photo' : ' new photos') + ' just arrived');
    render();
  });

  window.addEventListener('hashchange', () => { ui.up = { files: [], stage: 'pick', sent: 0, busy: false }; render(); });

  render();
  startShared();
  (function () { const el = document.getElementById('installTip'); if (!el || isStandalone() || !isTouch()) return; el.hidden = false; el.innerHTML = isIOS() ? 'To use it like an app: in Safari tap <b>Share</b>, then <b>Add to Home Screen</b>.' : 'To use it like an app: in Chrome tap the menu (three dots), then <b>Install app</b>.'; })();
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register('sw.js').catch(() => {});
  setInterval(() => { if (user && user.role === 'educator' && ui.etab === 'room' && !ui.sheet && !document.activeElement.matches('input,textarea')) render(); }, 60000);
})();
</script>
</body>
</html>

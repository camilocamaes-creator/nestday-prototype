<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nestday · Upload photos</title>
<meta name="theme-color" content="#F4EEE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="runtime/nestday-runtime.js"></script>
</head>
<body class="kind-phone">
<template data-dc-template="Upload"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4EEE2}
a{color:#2D5B4B}a:hover{color:#1F4538}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EEE2; color: #1D2A23; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex; flex-direction: column">

<header style="display: flex; flex-direction: column; gap: 2px; padding: 24px 20px 12px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 30px">Upload photos</h1>
<span style="font-size: 15px; color: #58625A">Sunflower Room</span>
</header>

<sc-if value="{{isError}}" hint-placeholder-val="{{ false }}">
<main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px">
<span style="width: 64px; height: 64px; border-radius: 50%; background: #F8E0D6; color: #7A2816; display: flex; align-items: center; justify-content: center"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16.5v.5"></path></svg></span>
<h2 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.25">{{errorTitle}}</h2>
<p style="margin: 0; font-size: 17px; line-height: 1.5; color: #3E4740">{{errorText}}</p>
</main>
</sc-if>

<sc-if value="{{isOk}}" hint-placeholder-val="{{ true }}">
<main style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; padding: 4px 16px 16px">

<sc-if value="{{notDone}}" hint-placeholder-val="{{ true }}">
<section style="background: #FFFCF6; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #58625A">Photos of</span>
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 36px; height: 36px; border-radius: 50%; background: #FBEBC8; color: #5A4210; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">MR</span>
<span style="font-size: 17px; font-weight: 700; flex-grow: 1">Maya R.</span>
<span style="font-size: 13px; color: #58625A">Code works until 11:10 am</span>
</div>
</section>
</sc-if>

<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ true }}">
<label style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; border: 2px dashed #B7AC93; border-radius: 24px; background: #FFFCF6; cursor: pointer; text-align: center; padding: 24px">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #2D5B4B; color: #FFFCF6; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></span>
<span style="font-family: 'Young Serif', Georgia, serif; font-size: 24px">Choose photos</span>
<span style="font-size: 15px; color: #58625A">Pick as many as you like from your camera roll</span>
<input type="file" accept="image/*" multiple onChange="{{onFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
</label>
</sc-if>

<sc-if value="{{isChosen}}" hint-placeholder-val="{{ false }}">
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; overflow-y: auto; max-height: 360px">
<sc-for list="{{thumbs}}" as="p" hint-placeholder-count="3">
<div style="position: relative; display: flex; flex-direction: column; gap: 4px">
<img src="{{p.url}}" alt="{{p.alt}}" style="width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 12px; display: block; background: #E9D6B0">
<sc-if value="{{p.canRemove}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{p.remove}}" aria-label="{{p.removeLabel}}" style="position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(29, 42, 35, 0.8); color: #FFFCF6; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</sc-if>
<sc-if value="{{p.showBar}}" hint-placeholder-val="{{ false }}">
<span style="height: 6px; border-radius: 3px; background: #E2D9C6; overflow: hidden"><span style="{{p.barStyle}}"></span></span>
</sc-if>
</div>
</sc-for>
</div>
<sc-if value="{{canEdit}}" hint-placeholder-val="{{ true }}">
<label style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border-radius: 24px; border: 1.5px solid #2D5B4B; color: #1F4538; font-size: 15px; font-weight: 700; cursor: pointer; position: relative">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add more photos
<input type="file" accept="image/*" multiple onChange="{{onFiles}}" style="position: absolute; width: 1px; height: 1px; opacity: 0">
</label>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="caption" style="font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #58625A">Caption (optional)</label>
<input id="caption" type="text" value="{{caption}}" onChange="{{onCaption}}" placeholder="What's happening in these photos?" style="height: 50px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D6CCB6; background: #FFFFFF; font: inherit; font-size: 16px; color: #1D2A23">
</div>
</sc-if>
<button type="button" onClick="{{send}}" disabled="{{sending}}" style="{{sendStyle}}">{{sendLabel}}</button>
</sc-if>

<sc-if value="{{isDone}}" hint-placeholder-val="{{ false }}">
<div style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 8px">
<span style="width: 72px; height: 72px; border-radius: 50%; background: #2D5B4B; color: #FFFCF6; display: flex; align-items: center; justify-content: center"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span>
<h2 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 28px; line-height: 1.25">{{doneTitle}}</h2>
<p style="margin: 0; font-size: 17px; color: #3E4740">They are now on Maya's day.</p>
<button type="button" onClick="{{again}}" style="height: 54px; border-radius: 27px; border: 0; background: #2D5B4B; color: #FFFCF6; font: inherit; font-size: 16px; font-weight: 700">Upload more of Maya</button>
<a href="Room.dc.html" style="display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 27px; border: 1.5px solid #D6CCB6; color: #1D2A23; text-decoration: none; font-size: 16px; font-weight: 700">Back to the room</a>
</div>
</sc-if>
</main>
</sc-if>

<footer style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 0 20px">
<span style="font-family: 'Young Serif', Georgia, serif; font-size: 15px">Nestday</span>
<span style="font-size: 12px; color: #58625A">Powered by Dantia.ca</span>
</footer>
</div>
</x-dc></template>
<script type="text/x-dc" data-dc-name="Upload">
class Component extends DCLogic {
componentWillUnmount() { if (this._iv) clearInterval(this._iv); }
renderVals() {
var self = this;
var st = this.state || {};
var link = this.props.linkState || 'valid';
var photos = st.photos || [];
var phase = st.phase || 'pick';
var progress = st.progress || 0;
var caption = st.caption || '';
var n = photos.length;
var ERR = {
expired: ['This code has expired', 'Codes stop working after 15 minutes so an old photo of the screen can’t be used. Ask the educator for a new code.'],
'no consent': ['This link can’t be used', 'One of the children in this link doesn’t have photo consent. Ask the educator for a new code.'],
invalid: ['This link doesn’t work', 'The code may be incomplete. Ask the educator to show the code again and scan it once more.']
};
var shown = phase === 'pick' && n > 0 ? 'chosen' : phase;
function onFiles(e) {
var files = Array.prototype.slice.call((e && e.target && e.target.files) || []);
if (!files.length) return;
var cur = (self.state && self.state.photos) || [];
var more = files.map(function (f) { return { url: URL.createObjectURL(f), name: f.name }; });
self.setState({ photos: cur.concat(more), phase: 'pick' });
}
return {
isError: link !== 'valid', isOk: link === 'valid',
errorTitle: ERR[link] ? ERR[link][0] : '', errorText: ERR[link] ? ERR[link][1] : '',
notDone: shown !== 'done',
isEmpty: shown === 'pick' && n === 0,
isChosen: shown === 'chosen' || shown === 'sending',
isDone: shown === 'done',
canEdit: shown === 'chosen',
sending: shown === 'sending',
onFiles: onFiles,
caption: caption,
onCaption: function (e) { self.setState({ caption: e.target.value }); },
thumbs: photos.map(function (p, i) {
var pct = Math.max(0, Math.min(100, progress * n - i * 100));
return {
url: p.url, alt: 'Chosen photo ' + (i + 1), removeLabel: 'Remove photo ' + (i + 1),
canRemove: shown === 'chosen', showBar: shown === 'sending',
barStyle: 'display: block; height: 100%; background: #2D5B4B; width: ' + pct + '%',
remove: function () { var cur = (self.state && self.state.photos) || []; self.setState({ photos: cur.filter(function (_, j) { return j !== i; }) }); }
};
}),
sendLabel: shown === 'sending' ? 'Sending ' + n + (n === 1 ? ' photo' : ' photos') + '…' : 'Send ' + n + (n === 1 ? ' photo' : ' photos'),
sendStyle: 'height: 56px; border-radius: 28px; border: 0; margin-top: auto; font: inherit; font-size: 17px; font-weight: 700; ' + (shown === 'sending' ? 'background: #E2D9C6; color: #3E4740' : 'background: #2D5B4B; color: #FFFCF6'),
send: function () {
if (!n) return;
self.setState({ phase: 'sending', progress: 0 });
if (self._iv) clearInterval(self._iv);
self._iv = setInterval(function () {
var p = ((self.state && self.state.progress) || 0) + 0.06;
if (p >= 1) { clearInterval(self._iv); self.setState({ progress: 1, phase: 'done', sentCount: n }); }
else self.setState({ progress: p });
}, 120);
},
doneTitle: (st.sentCount || n) + ((st.sentCount || n) === 1 ? ' photo sent.' : ' photos sent.'),
again: function () { self.setState({ photos: [], phase: 'pick', progress: 0, caption: '' }); }
};
}
}
</script>
<div id="app"></div>
<script>NestdayDC.mount('Upload');</script>
</body>
</html>

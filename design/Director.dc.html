<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=1440">
<title>Nestday · Director</title>
<meta name="theme-color" content="#F4EEE2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nestday">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="runtime/nestday-runtime.js"></script>
</head>
<body class="kind-desktop">
<template data-dc-template="Director"><x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&amp;family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;background:#F4EEE2}
a{color:#2D5B4B}a:hover{color:#1F4538}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; position: relative; overflow: hidden; background: #F4EEE2; color: #1D2A23; font-family: 'Hanken Grotesk', system-ui, sans-serif; display: flex">

<aside style="width: 256px; flex-shrink: 0; box-sizing: border-box; background: #1D2A23; color: #F4EEE2; display: flex; flex-direction: column; padding: 28px 16px 20px">
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 12px">
<span style="font-family: 'Young Serif', Georgia, serif; font-size: 28px; line-height: 1.1">Nestday</span>
<span style="font-size: 12px; color: #B9C2BA">Powered by Dantia.ca</span>
</div>
<div style="margin: 24px 12px 16px; padding: 12px 14px; border-radius: 14px; background: #26332C; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700">Sunflower Early Learning Centre</span>
<span style="font-size: 13px; color: #B9C2BA">Airdrie AB</span>
</div>
<nav aria-label="Director" style="display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
<button type="button" onClick="{{n.go}}" aria-current="{{n.current}}" style="{{n.style}}">
<span style="flex-grow: 1; text-align: left">{{n.label}}</span>
<sc-if value="{{n.planned}}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; background: #34423A; color: #C9D2CA">Planned</span></sc-if>
<sc-if value="{{n.hasCount}}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: #E8A73A; color: #1D2A23">{{n.count}}</span></sc-if>
</button>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px">
<span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; background: #E8A73A; color: #1D2A23; display: flex; align-items: center; justify-content: center; font-weight: 700">K</span>
<span style="display: flex; flex-direction: column; flex-grow: 1"><span style="font-size: 15px; font-weight: 700">Karen</span><span style="font-size: 13px; color: #B9C2BA">Director</span></span>
<button type="button" onClick="{{signOut}}" style="height: 40px; padding: 0 12px; border-radius: 20px; border: 1px solid #45534B; background: transparent; color: #F4EEE2; font: inherit; font-size: 13px; font-weight: 600">Sign out</button>
</div>
</aside>

<main style="flex-grow: 1; min-width: 0; overflow-y: auto; padding: 32px 40px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">

<sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 38px">Good morning, Karen</h1>
<span style="font-size: 16px; color: #58625A">Friday 25 September · 10:55 am</span>
</div>
<button type="button" onClick="{{openAnnounce}}" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 25px; border: 0; background: #2D5B4B; color: #FFFCF6; font: inherit; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h4l6 4V6L7 10z"></path><path d="M17 9a4 4 0 0 1 0 6"></path></svg>Send announcement</button>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<div style="background: #FFFCF6; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #58625A">Children here</span><span style="font-family: 'Young Serif', Georgia, serif; font-size: 36px">58 <span style="font-size: 18px; color: #58625A">of 64</span></span></div>
<div style="background: #FFFCF6; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #58625A">Educators on shift</span><span style="font-family: 'Young Serif', Georgia, serif; font-size: 36px">13</span></div>
<div style="background: #FFFCF6; border-radius: 20px; padding: 18px 20px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; color: #58625A">Rooms in ratio</span><span style="font-family: 'Young Serif', Georgia, serif; font-size: 36px">5 <span style="font-size: 18px; color: #58625A">of 5</span></span></div>
<div style="{{attnCardStyle}}"><span style="font-size: 14px; color: #5A4210">Need your attention</span><span style="font-family: 'Young Serif', Georgia, serif; font-size: 36px">{{attnCount}}</span></div>
</div>

<div style="display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; align-items: start">
<section style="background: #FFFCF6; border-radius: 22px; padding: 20px 22px 8px">
<h2 style="margin: 0 0 8px; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Rooms</h2>
<dc-table style="width: 100%; border-collapse: collapse; font-size: 15px">
<dc-thead>
<dc-tr style="text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #58625A">
<dc-th style="padding: 10px 0; font-weight: 700">Room</dc-th><dc-th style="padding: 10px 0; font-weight: 700">Age group</dc-th><dc-th style="padding: 10px 0; font-weight: 700">Children</dc-th><dc-th style="padding: 10px 0; font-weight: 700">Educators</dc-th><dc-th style="padding: 10px 0; font-weight: 700">Ratio</dc-th>
</dc-tr>
</dc-thead>
<dc-tbody>
<sc-for list="{{rooms}}" as="r" hint-placeholder-count="5">
<dc-tr style="border-top: 1px solid #EDE6D6">
<dc-td style="padding: 13px 0; font-weight: 700">{{r.name}}</dc-td>
<dc-td style="padding: 13px 0; color: #3E4740">{{r.age}}</dc-td>
<dc-td style="padding: 13px 0; font-variant-numeric: tabular-nums">{{r.kids}}</dc-td>
<dc-td style="padding: 13px 0; font-variant-numeric: tabular-nums">{{r.edu}}</dc-td>
<dc-td style="padding: 13px 0"><span style="font-size: 13px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #DCE8E0; color: #1F4538">{{r.ratio}}</span></dc-td>
</dc-tr>
</sc-for>
</dc-tbody>
</dc-table>
</section>

<section style="background: #FFFCF6; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 8px; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 22px">Needs your attention</h2>
<sc-if value="{{attnEmpty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 16px 0; font-size: 16px; color: #1F4538; font-weight: 600">Nothing needs you right now.</p>
</sc-if>
<sc-for list="{{attention}}" as="a" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #EDE6D6">
<span style="{{a.dotStyle}}"></span>
<span style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 700">{{a.title}}</span>
<span style="font-size: 13px; color: #58625A; line-height: 1.35">{{a.detail}}</span>
</span>
<button type="button" onClick="{{a.act}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid #2D5B4B; background: transparent; color: #1F4538; font: inherit; font-size: 13px; font-weight: 700; white-space: nowrap; flex-shrink: 0">{{a.action}}</button>
</div>
</sc-for>
</section>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
<section style="background: #FFFCF6; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #58625A">Reports</span>
<h2 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 21px">September affordability grant claim</h2>
<span style="font-size: 15px; color: #3E4740">Attendance complete to yesterday: <strong>16 of 21</strong> operating days</span>
<span style="height: 10px; border-radius: 5px; background: #EDE6D6; overflow: hidden"><span style="display: block; width: 76%; height: 100%; background: #2D5B4B"></span></span>
</section>
<section style="background: #FFFCF6; border-radius: 22px; padding: 20px 22px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex-grow: 1; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #58625A">Parent fees · September</span>
<button type="button" onClick="{{sendReminders}}" disabled="{{remindersSent}}" style="{{remindStyle}}">{{remindLabel}}</button>
</div>
<span style="font-family: 'Young Serif', Georgia, serif; font-size: 28px">$19,575.00 <span style="font-size: 16px; color: #58625A">of $20,880.00 collected</span></span>
<span style="height: 10px; border-radius: 5px; background: #EDE6D6; overflow: hidden"><span style="display: block; width: 94%; height: 100%; background: #E8A73A"></span></span>
<span style="font-size: 15px; color: #3E4740">60 families paid · 4 outstanding</span>
</section>
</div>
</sc-if>

<sc-if value="{{isFamilies}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 36px">Families and logins</h1>
<span style="font-size: 16px; color: #58625A">64 children · {{guardianCount}} guardians · {{activeGuardians}} active logins</span>
</div>
<button type="button" onClick="{{openGuardian}}" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 25px; border: 0; background: #2D5B4B; color: #FFFCF6; font: inherit; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a guardian</button>
</div>

<div style="display: flex; gap: 12px; align-items: flex-end">
<div style="display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<label for="fam-search" style="font-size: 13px; font-weight: 700; color: #58625A">Search by child or guardian</label>
<input id="fam-search" type="search" value="{{q}}" onChange="{{onQ}}" placeholder="Try Maya or Hannah" style="height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 1.5px solid #D6CCB6; background: #FFFCF6; font: inherit; font-size: 16px; color: #1D2A23">
</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 200px">
<label for="fam-room" style="font-size: 13px; font-weight: 700; color: #58625A">Room</label>
<select id="fam-room" value="{{roomFilter}}" onChange="{{onRoomFilter}}" style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #D6CCB6; background: #FFFCF6; font: inherit; font-size: 15px; color: #1D2A23">
<option value="All rooms">All rooms</option><option value="Seedlings">Seedlings</option><option value="Sprouts">Sprouts</option><option value="Sunflower">Sunflower</option><option value="Maple">Maple</option><option value="Oak">Oak</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; width: 200px">
<label for="fam-status" style="font-size: 13px; font-weight: 700; color: #58625A">Login status</label>
<select id="fam-status" value="{{statusFilter}}" onChange="{{onStatusFilter}}" style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1.5px solid #D6CCB6; background: #FFFCF6; font: inherit; font-size: 15px; color: #1D2A23">
<option value="Any status">Any status</option><option value="Active">Active</option><option value="Invite sent">Invite sent</option><option value="Not invited">Not invited</option><option value="Locked">Locked</option>
</select>
</div>
</div>

<section style="background: #FFFCF6; border-radius: 22px; padding: 8px 22px">
<dc-table style="width: 100%; border-collapse: collapse; font-size: 15px">
<dc-thead>
<dc-tr style="text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #58625A">
<dc-th style="padding: 12px 0; font-weight: 700">Child</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Guardian</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Login status</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Last sign-in</dc-th><dc-th style="padding: 12px 0; font-weight: 700; text-align: right">Action</dc-th>
</dc-tr>
</dc-thead>
<dc-tbody>
<sc-for list="{{families}}" as="f" hint-placeholder-count="10">
<dc-tr style="border-top: 1px solid #EDE6D6">
<dc-td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><strong>{{f.child}}</strong><span style="font-size: 13px; color: #58625A">{{f.room}}</span></span></dc-td>
<dc-td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{f.guardian}}</span><span style="font-size: 13px; color: #58625A">{{f.emailShown}}</span></span></dc-td>
<dc-td style="padding: 10px 0"><span style="{{f.badge}}">{{f.status}}</span></dc-td>
<dc-td style="padding: 10px 0; color: #3E4740">{{f.last}}</dc-td>
<dc-td style="padding: 10px 0; text-align: right"><button type="button" onClick="{{f.act}}" disabled="{{f.disabled}}" style="{{f.btnStyle}}">{{f.action}}</button></dc-td>
</dc-tr>
</sc-for>
</dc-tbody>
</dc-table>
<sc-if value="{{noFamilies}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; padding: 20px 0; font-size: 15px; color: #58625A">No guardians match. Try another name or clear the filters.</p>
</sc-if>
</section>
<span style="font-size: 14px; color: #58625A">{{familyFoot}}</span>
</sc-if>

<sc-if value="{{isStaff}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 36px">Staff accounts</h1>
<span style="font-size: 16px; color: #58625A">{{staffCount}} people · {{staffActive}} with active logins · Educators use a 4-digit PIN on the room tablets</span>
</div>
<button type="button" onClick="{{openStaff}}" style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 22px; border-radius: 25px; border: 0; background: #2D5B4B; color: #FFFCF6; font: inherit; font-size: 15px; font-weight: 700"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add a staff member</button>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 16px; background: #F8E0D6; color: #7A2816; font-size: 15px; font-weight: 600">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l10 18H2z"></path><path d="M12 10v5M12 18v.5"></path></svg>
First aid: 2 certificates expire within 30 days and 1 has expired.
</div>
<section style="background: #FFFCF6; border-radius: 22px; padding: 8px 22px">
<dc-table style="width: 100%; border-collapse: collapse; font-size: 15px">
<dc-thead>
<dc-tr style="text-align: left; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: #58625A">
<dc-th style="padding: 12px 0; font-weight: 700">Name</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Role and room</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Level</dc-th><dc-th style="padding: 12px 0; font-weight: 700">First aid</dc-th><dc-th style="padding: 12px 0; font-weight: 700">Login</dc-th><dc-th style="padding: 12px 0; font-weight: 700; text-align: right">Actions</dc-th>
</dc-tr>
</dc-thead>
<dc-tbody>
<sc-for list="{{staff}}" as="s" hint-placeholder-count="8">
<dc-tr style="border-top: 1px solid #EDE6D6">
<dc-td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><strong>{{s.name}}</strong><span style="font-size: 13px; color: #58625A">{{s.email}}</span></span></dc-td>
<dc-td style="padding: 10px 0"><span style="display: flex; flex-direction: column"><span style="font-weight: 600">{{s.role}}</span><span style="font-size: 13px; color: #58625A">{{s.room}}</span></span></dc-td>
<dc-td style="padding: 10px 0">{{s.level}}</dc-td>
<dc-td style="padding: 10px 0"><span style="{{s.aidBadge}}">{{s.aid}}</span></dc-td>
<dc-td style="padding: 10px 0"><span style="display: flex; flex-direction: column; gap: 3px; align-items: flex-start"><span style="{{s.badge}}">{{s.status}}</span><span style="font-size: 13px; color: #58625A">{{s.last}}</span></span></dc-td>
<dc-td style="padding: 10px 0"><span style="display: flex; gap: 6px; justify-content: flex-end">
<sc-for list="{{s.actions}}" as="b" hint-placeholder-count="2">
<button type="button" onClick="{{b.act}}" style="{{b.style}}">{{b.label}}</button>
</sc-for>
</span></dc-td>
</dc-tr>
</sc-for>
</dc-tbody>
</dc-table>
</section>
</sc-if>

<sc-if value="{{isPlanned}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 12px">
<h1 style="margin: 0; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 36px">{{plannedTitle}}</h1>
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; background: #FBEBC8; color: #5A4210">Planned</span>
</div>
<section style="max-width: 640px; background: #FFFCF6; border-radius: 22px; padding: 24px; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 16px; color: #3E4740">This page isn't designed yet. It will hold:</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; font-size: 16px; line-height: 1.45">
<sc-for list="{{plannedItems}}" as="p" hint-placeholder-count="4"><li>{{p.text}}</li></sc-for>
</ul>
</section>
</sc-if>
</main>

<sc-if value="{{drawerOpen}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0; background: rgba(20, 26, 22, 0.45); display: flex; justify-content: flex-end">
<section role="dialog" aria-label="{{drawerTitle}}" style="width: 480px; height: 100%; box-sizing: border-box; background: #FFFCF6; padding: 28px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto">
<div style="display: flex; align-items: center; gap: 12px">
<h2 style="margin: 0; flex-grow: 1; font-family: 'Young Serif', Georgia, serif; font-weight: 400; font-size: 28px">{{drawerTitle}}</h2>
<button type="button" aria-label="Close" onClick="{{closeDrawer}}" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #F1ECE1; color: #1D2A23; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<sc-if value="{{isGuardianForm}}" hint-placeholder-val="{{ true }}">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="g-child" style="font-size: 13px; font-weight: 700; color: #58625A">Child</label>
<select id="g-child" value="{{gChild}}" onChange="{{onGChild}}" style="height: 48px; padding: 0 12px; border-radius: 12px; border: 1.5px solid #D6CCB6; background: #FFFFFF; font: inherit; font-size: 16px; color: #1D2A23">
<option value="Maya R. · Sunflower">Maya R. · Sunflower</option><option value="Noah T. · Sunflower">Noah T. · Sunflower</option><option value="Aria P. · Sunflower">Aria P. · Sunflower</option><option value="Leo S. · Sunflower">Leo S. · Sunflower</option><option value="Zoe M. · Sunflower">Zoe M. · Sunflower</option><option value="Ethan W. · Sunflower">Ethan W. · Sunflower</option><option value="Lily C. · Sunflower">Lily C. · Sunflower</option><option value="Omar H. · Sunflower">Omar H. · Sunflower</option><option value="Ava B. · Sunflower">Ava B. · Sunflower</option>
</select>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="g-name" style="font-size: 13px; font-weight: 700; color: #58625A">Full name</label>
<input id="g-name" type="text" value="{{gName}}" onChange="{{onGName}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D6CCB6; background: #FFFFFF; font: inherit; font-size: 16px; color: #1D2A23">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="g-email" style="font-size: 13px; font-weight: 700; color: #58625A">Email for login</label>
<input id="g-email" type="email" value="{{gEmail}}" onChange="{{onGEmail}}" style="height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1.5px solid #D6CCB6; background: #FFFFFF; font: inherit; font-size: 16px; color: #1D2A23">
</div>

q: q, onQ: field('q'),
roomFilter: roomFilter, onRoomFilter: field('roomFilter'),
statusFilter: statusFilter, onStatusFilter: field('statusFilter'),
families: families, noFamilies: families.length === 0,
familyFoot: 'Showing ' + families.length + ' of ' + (112 + fam.length - FAM0.length) + ' guardians in this sample',

staffCount: 16 + (staffList.length - STAFF0.length),
staffActive: staffList.filter(function (s) { return s.status === 'Active'; }).length + 8,
staff: staff,

drawerOpen: !!drawer,
drawerTitle: isG ? 'Add a guardian' : 'Add a staff member',
closeDrawer: function () { self.setState({ drawer: null }); },
openGuardian: function () { self.setState({ drawer: 'guardian', gName: '', gEmail: '' }); },
openStaff: function () { self.setState({ drawer: 'staff', sName: '', sEmail: '' }); },
isGuardianForm: isG, isStaffForm: drawer === 'staff',
gChild: gForm.child, onGChild: field('gChild'),
gName: gForm.name, onGName: field('gName'),
gEmail: gForm.email, onGEmail: field('gEmail'),
gRel: gForm.rel, onGRel: field('gRel'),
sName: sForm.name, onSName: field('sName'),
sEmail: sForm.email, onSEmail: field('sEmail'),
sRole: sForm.role, onSRole: field('sRole'),
sRoom: sForm.room, onSRoom: field('sRoom'),
sLevel: sForm.level, onSLevel: field('sLevel'),
sAid: sForm.aid, onSAid: field('sAid'),
permLegend: isG ? 'What this guardian can do' : 'Permissions',
perms: (isG ? G_PERMS : S_PERMS).map(function (label, i) {
return { label: label, on: !!permList[i], toggle: function () { var p = permList.slice(); p[i] = !p[i]; var o = {}; o[permKey] = p; self.setState(o); } };
}),
cannotSubmit: !canSubmit,
submitStyle: 'height: 54px; border-radius: 27px; border: 0; font: inherit; font-size: 16px; font-weight: 700; ' + (canSubmit ? 'background: #2D5B4B; color: #FFFCF6; cursor: pointer' : 'background: #E2D9C6; color: #58625A; cursor: not-allowed'),
inviteNote: 'They set their own password from the email. The link expires after 7 days.',
submitDrawer: function () {
if (!canSubmit) return;
if (isG) {
var parts = gForm.child.split(' · ');
var row = { id: Date.now(), child: parts[0], room: parts[1], guardian: gForm.name.trim(), rel: gForm.rel, email: gForm.email.trim(), status: 'Invite sent', last: '—' };
flash('Login invite emailed to ' + row.guardian.split(' ')[0], { fam: [row].concat(fam), drawer: null, q: '', roomFilter: 'All rooms', statusFilter: 'Any status' });
} else {
var aidTxt = sForm.aid ? new Date(sForm.aid + 'T12:00:00').toLocaleDateString('en-CA', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Not entered';
var srow = { id: Date.now(), name: sForm.name.trim(), email: sForm.email.trim(), role: sForm.role, room: sForm.room, level: sForm.level, aid: aidTxt, aidState: 'ok', status: 'Invite sent', last: '—' };
flash('Login invite emailed to ' + srow.name.split(' ')[0], { staff: staffList.concat([srow]), drawer: null });
}
},

hasToast: !!toast, toast: toast || ''
};
}
}
</script>
<div id="app"></div>
<script>NestdayDC.mount('Director');</script>
</body>
</html>
